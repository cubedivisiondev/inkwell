name: test

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. This workflow builds and tests; it never writes to the
# repository, so a fork's pull request gets a token that cannot do anything even
# if the build is made to run arbitrary code. Note `pull_request`, deliberately,
# and never `pull_request_target`, which would hand fork code the base repo's
# token and secrets. No step interpolates event data into a shell command.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install potrace
        run: sudo apt-get update && sudo apt-get install -y potrace
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

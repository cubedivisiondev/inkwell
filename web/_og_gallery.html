<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>INKWELL OG Gallery</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
body { margin: 0; padding: 40px; background: #111; color: #fff; font-family: 'Trebuchet MS', Arial, sans-serif; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: 0.05em; margin: 0 0 8px; }
.sub { color: #aaa; font-size: 13px; margin-bottom: 24px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.image-wrap { background: #000; line-height: 0; border-radius: 4px; overflow: hidden; }
.image-wrap img { display: block; width: 100%; height: auto; }
.card .label { margin-top: 8px; background: #1a1a1a; border: 1px solid #2a2a2a; border-left: 3px solid #6a6a6a;
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #c0c0c0; padding: 7px 12px; border-radius: 3px; }
</style></head><body>
<h1>INKWELL - OG Card Gallery</h1>
<div class="sub">1 card x 5 formats, generated by scripts/make-og.mjs. Review before a prod cutover.</div>
<div class="grid">
    <div class="card">
      <div class="image-wrap"><img src="og-card.png" loading="lazy" alt="Landscape 1200x630"></div>
      <div class="label">Landscape 1200x630</div>
    </div>
    <div class="card">
      <div class="image-wrap"><img src="og-card-youtube.png" loading="lazy" alt="YouTube 1280x720"></div>
      <div class="label">YouTube 1280x720</div>
    </div>
    <div class="card">
      <div class="image-wrap"><img src="og-card-square.png" loading="lazy" alt="Square 1080x1080"></div>
      <div class="label">Square 1080x1080</div>
    </div>
    <div class="card">
      <div class="image-wrap"><img src="og-card-pin.png" loading="lazy" alt="Pin 1000x1500"></div>
      <div class="label">Pin 1000x1500</div>
    </div>
    <div class="card">
      <div class="image-wrap"><img src="og-card-story.png" loading="lazy" alt="Story 1080x1920"></div>
      <div class="label">Story 1080x1920</div>
    </div>
</div>
</body></html>
